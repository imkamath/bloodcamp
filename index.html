<style>
:root{--blue:#004C8F;--blue-bg:#E8F0FB;--red:#ED232A;--red-bg:#FDECEC;--green:#1E7B3C;--green-bg:#E6F4EA;--amber:#8A5A00;--amber-bg:#FFF4DC;--violet:#5B3FA8;--violet-bg:#EFEAFB;--text:#1F2328;--muted:#5F6670;--faint:#8B929A;--border:#D9DDE2;--bg:#F4F6F8;--card:#fff;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;font-weight:600;margin:20px 0 8px}
label.lb,.lb{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text)}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex-shrink:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.field{margin-bottom:12px}
.err{font-size:13px;color:var(--red);margin-top:4px;min-height:0}
.okmsg{font-size:14px;color:var(--green);margin-top:8px}
button,.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{background:var(--bg)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#003A6E}
button.danger{color:var(--red)}
button:disabled{opacity:.55;cursor:default}
.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;flex-shrink:0}
.brand .org{font-weight:700;font-size:16px;color:var(--blue);letter-spacing:.2px}
.brand .col{font-size:13px;color:var(--muted)}
.pill{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);white-space:nowrap}
.p-blue{background:var(--blue-bg);color:var(--blue)}.p-green{background:var(--green-bg);color:var(--green)}.p-red{background:var(--red-bg);color:var(--red)}.p-amber{background:var(--amber-bg);color:var(--amber)}.p-violet{background:var(--violet-bg);color:var(--violet)}
.list-row{display:flex;align-items:center;gap:6px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.list-row:first-child{border-top:none}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{padding:5px 7px;font-size:13px;line-height:1}
.panel{background:#FAFBFC;border:1px solid var(--blue);border-radius:10px;padding:12px;margin:4px 0 10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:600}
.stat .t{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1}
.tabs button.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px}
.seg button{flex:1;font-size:13px;padding:8px 4px}
.seg button.on{border:2px solid var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:600}
.drop{color:var(--red)}
.hide{display:none!important}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk input{margin-top:2px}
.poster{text-align:center}
.poster #qr{display:inline-block;padding:12px;background:#fff;border:1px solid var(--border);border-radius:12px;margin:14px 0}
.poster #qr img,.poster #qr canvas{display:block}
@media print{body{background:#fff}.noprint{display:none!important}.card{border:none}}

.drow{border-top:1px solid var(--border);padding:10px 0}
.drow:first-child{border-top:none}
.sbtn{font-size:12px;padding:6px 8px}
.sbtn.s{background:var(--green-bg);color:var(--green);border-color:var(--green);font-weight:600}
.sbtn.r{background:var(--red-bg);color:var(--red);border-color:var(--red);font-weight:600}
.rmk{display:flex;gap:8px;align-items:center;margin-top:8px}
.rmk input,.rmk select{flex:1;padding:7px 9px;font-size:14px}
.saved{font-size:12px;min-width:58px}
.upd{font-size:11px;color:var(--faint);margin-top:4px}
.qrbox{background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px;line-height:0;flex-shrink:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1F2328;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%}
#toast.bad{background:var(--red)}
</style>
</head>

    if (a === 'edit') campEditor(A.camps.find(c => c.id === b.dataset.id));
    if (a === 'copy') copyText(b.dataset.link, b);
    if (a === 'xlsx') downloadExcel(b.dataset.id, b);
    if (a === 'status') { b.disabled = true; try { await api('setCampStatus', TOKEN, b.dataset.id, b.dataset.s); adminView(); } catch (e) { handleErr(e); b.disabled = false; } }
  });
}
function newKey() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function campEditor(c) {
  E = c ? { id: c.id, collab: c.collab, date: c.date, venue: c.venue, cols: JSON.parse(JSON.stringify(c.cols)) }
    : { id: '', collab: '', date: '', venue: '', cols: JSON.parse(JSON.stringify(A.defaultCols)) };
  E.open = -1;
  $('view').innerHTML = `<h2>${c ? 'Edit camp' : 'New camp'}</h2>
    <div class="card"><span class="lb">Form header</span>${brand(null, 36)}
      <div class="field" style="margin-top:12px"><label class="lb" for="ec">In collaboration with *</label><input id="ec" value="${esc(E.collab)}" placeholder="TATA Institute of Social Sciences"></div>
      <div class="g2"><div><label class="lb" for="ed">Camp date *</label><input id="ed" type="date" value="${esc(E.date)}"></div><div><label class="lb" for="ev">Venue</label><input id="ev" value="${esc(E.venue)}" placeholder="Deonar Govandi"></div></div></div>
    <h2>Columns</h2>
    <div class="card"><p class="muted" style="margin-top:0">&#8593;&#8595; reorder · &#9998; rules · &#128274; can't be removed · <span class="pill p-blue">Donor</span> public form · <span class="pill p-violet">Team</span> staff only${c ? '<br>Removing a column that already has data keeps that data at the end of the sheet tab, marked [Removed].' : ''}</p>
      <div id="clist"></div><button class="full" id="cadd" style="margin-top:10px">+ Add column</button></div>
    <div class="err" id="eerr2"></div>
    <div class="row" style="margin-top:8px"><button class="primary" id="esave" style="flex:2">${c ? 'Save changes' : 'Create camp and get QR'}</button><button id="ecancel" style="flex:1">Cancel</button></div>
    <button class="full" id="edef" style="margin-top:8px">Save these columns as default for new camps</button><p class="okmsg" id="edefok"></p>`;
  drawCols();
  $('cadd').onclick = () => {
    if (E.open > -1 && E.cols[E.open]._new) return;
    const at = E.cols.findIndex(f => f.by === 't'); const p = at < 0 ? E.cols.length : at;
    E.cols.splice(p, 0, { k: newKey(), l: '', t: 'text', r: 0, by: 'd', min: '', max: '', _new: 1 }); E.open = p; drawCols(); $('cl').focus();
  };
  $('ecancel').onclick = () => adminView();
  const gather = () => ({ id: E.id, collab: $('ec').value.trim(), date: $('ed').value, venue: $('ev').value.trim(), cols: E.cols.filter(f => !f._new) });
  $('esave').onclick = async () => {
    const d = gather();
    if (!d.collab) { $('eerr2').textContent = 'Enter the collaborating organisation.'; return; }
    if (!d.date) { $('eerr2').textContent = 'Set the camp date.'; return; }
    const b = $('esave'); b.disabled = true; b.textContent = 'Saving…';
    try { const r = await api('saveCamp', TOKEN, d); adminView(c ? 'Camp updated.' : 'Camp created.', c ? null : r.id); }
    catch (e) { b.disabled = false; b.textContent = c ? 'Save changes' : 'Create camp and get QR'; handleErr(e, $('eerr2')); }
  };
  $('edef').onclick = async () => {
    try { await api('saveDefaultCols', TOKEN, gather().cols); A.defaultCols = gather().cols; $('edefok').textContent = 'Saved. New camps will start with these columns.'; setTimeout(() => { if ($('edefok')) $('edefok').textContent = ''; }, 3000); }
    catch (e) { handleErr(e, $('eerr2')); }
  };
  ['ec', 'ed', 'ev'].forEach(id => $(id).addEventListener('input', () => $('eerr2').textContent = ''));
}
function colRule(f) { const r = rangeText(f); if (r) return r; if (f.t === 'tel') return '10 digits'; if (f.t === 'select') return f.o.length + ' options'; return ''; }
function colExtra(t, f) {
  if (t === 'number') return `<span class="lb">Allowed range</span><div class="g2" style="margin-bottom:10px"><input id="cmin" type="number" placeholder="Min" value="${f.min ?? ''}"><input id="cmax" type="number" placeholder="Max" value="${f.max ?? ''}"></div>`;
  if (t === 'select') return `<span class="lb">Options, one per line</span><textarea id="co" rows="5" style="margin-bottom:10px">${esc((f.o || []).join('\n'))}</textarea>`;
  return '';
}
function drawCols() {
  const L = E.cols;
  $('clist').innerHTML = L.map((f, i) => {
    const lock = LOCKED.includes(f.k), r = colRule(f);
    let h = `<div class="list-row"><button class="ib" data-mv="${i}" data-d="-1" ${i ? '' : 'disabled'} aria-label="Move up">&#8593;</button><button class="ib" data-mv="${i}" data-d="1" ${i < L.length - 1 ? '' : 'disabled'} aria-label="Move down">&#8595;</button>
      <div class="grow ell">${esc(f.l || 'New column')}${f.r && f.by === 'd' ? ' <span style="color:var(--red)">*</span>' : ''}</div>${r ? `<span class="pill">${esc(r)}</span>` : ''}<span class="pill ${f.by === 't' ? 'p-violet' : 'p-blue'}">${f.by === 't' ? 'Team' : 'Donor'}</span>
      <button class="ib" data-ed="${i}" aria-label="Edit">&#9998;</button>${lock ? '<span class="ib" title="Required column" style="color:var(--faint)">&#128274;</span>' : `<button class="ib danger" data-rm="${i}" aria-label="Remove">&#10005;</button>`}</div>`;
    if (E.open === i) {
      const LK = lock ? 'disabled' : '';
      h += `<div class="panel"><div class="field"><label class="lb" for="cl">Column name</label><input id="cl" value="${esc(f.l)}" placeholder="Hemoglobin level"></div>
        <div class="g2" style="margin-bottom:10px"><div><span class="lb">Type</span><select id="ct" ${LK}>${Object.keys(TN).map(k => `<option value="${k}" ${k === f.t ? 'selected' : ''}>${TN[k]}</option>`).join('')}</select></div>
        <div><span class="lb">Filled by</span><select id="cb" ${LK}><option value="d" ${f.by === 'd' ? 'selected' : ''}>Donor</option><option value="t" ${f.by === 't' ? 'selected' : ''}>Team</option></select></div></div>
        <label class="chk" style="margin-bottom:10px"><input type="checkbox" id="cr" ${f.r ? 'checked' : ''} ${LK}> <span>Required for donor</span></label>
        <div id="cx">${colExtra(f.t, f)}</div><div class="err" id="cerr"></div>
        <div class="row"><button class="primary" id="cok" style="flex:1">Save column</button><button id="ccn" style="flex:1">Cancel</button></div></div>`;
    }
    return h;
  }).join('');
  $('clist').querySelectorAll('[data-mv]').forEach(b => b.onclick = () => {
    const i = +b.dataset.mv, j = i + (+b.dataset.d); if (j < 0 || j >= L.length) return;
    [L[i], L[j]] = [L[j], L[i]]; if (E.open === i) E.open = j; else if (E.open === j) E.open = i; drawCols();
  });
  $('clist').querySelectorAll('[data-ed]').forEach(b => b.onclick = () => {
    let i = +b.dataset.ed;
    if (E.open > -1 && L[E.open]._new && E.open !== i) { L.splice(E.open, 1); if (i > E.open) i--; }
    E.open = E.open === i ? -1 : i; drawCols();
  });
  $('clist').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { L.splice(+b.dataset.rm, 1); E.open = -1; drawCols(); });
  if (E.open > -1) {
    const f = L[E.open];
    $('ct').onchange = () => { $('cx').innerHTML = colExtra($('ct').value, { min: '', max: '', o: [] }); };
    $('ccn').onclick = () => { if (f._new) L.splice(E.open, 1); E.open = -1; drawCols(); };
    $('cl').addEventListener('input', () => $('cerr').textContent = '');
    $('cok').onclick = () => {
      const l = $('cl').value.trim(); if (!l) { $('cerr').textContent = 'Enter a column name.'; return; }
      const t = $('ct').value, n = Object.assign({}, f, { l, t, r: $('cr').checked ? 1 : 0, by: $('cb').value }); delete n._new;
      if (t === 'number') { const a = $('cmin').value, b = $('cmax').value; if (a !== '' && b !== '' && +a > +b) { $('cerr').textContent = 'Min must be less than max.'; return; } n.min = a === '' ? '' : +a; n.max = b === '' ? '' : +b; } else { delete n.min; delete n.max; }
      if (t === 'select') { const o = $('co').value.split('\n').map(s => s.trim()).filter(Boolean); if (o.length < 2) { $('cerr').textContent = 'Add at least 2 options.'; return; } n.o = o; } else delete n.o;
      if (n.by === 't') n.r = 0;
      L[E.open] = n; E.open = -1; drawCols();
    };
  }
}
function drawStaff() {
  const box = $('staff');
  box.innerHTML = A.staff.map(s => {
    const scope = s.camps === 'ALL' ? 'All camps' : s.camps.split(',').map(id => { const c = A.camps.find(x => x.id === id); return c ? c.dateLabel : id; }).join(', ');
    return `<div class="list-row"><div class="grow"><div class="ell">${esc(s.email)}</div><div class="muted ell">${esc(s.role === 'Team' ? scope + ' · status, remarks, Excel' : 'All camps, full setup')}</div></div><span class="pill ${s.role === 'Team' ? 'p-violet' : 'p-blue'}">${esc(s.role)}</span>${s.role === 'Owner' || s.email === A.me.email ? '<span class="ib" style="width:30px"></span>' : `<button class="ib danger" data-rs="${esc(s.email)}" aria-label="Remove access">&#10005;</button>`}</div>`;
  }).join('') + `<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:12px">
    <div class="field"><label class="lb" for="se">Staff Gmail ID</label><input id="se" type="email" placeholder="kiran.desai@gmail.com"></div>
    <div class="g2" style="margin-bottom:10px"><div><span class="lb">Role</span><select id="sr"><option value="Team">Team: status, remarks, Excel</option><option value="Admin">Admin: full setup</option></select></div>
    <div id="scw"><span class="lb">Camps</span><select id="sc"><option value="ALL">All camps</option><option value="SEL">Selected camps</option></select></div></div>
    <div id="scl" class="hide" style="margin-bottom:10px">${A.camps.map(c => `<label class="chk" style="margin-bottom:6px"><input type="checkbox" value="${c.id}" class="scc"> <span>${esc(c.dateLabel)}${c.venue ? ' · ' + esc(c.venue) : ''}</span></label>`).join('') || '<span class="muted">No camps yet</span>'}</div>
    <div class="err" id="serr"></div><button class="primary full" id="sadd">Give access</button><p class="okmsg" id="sok"></p></div>`;
  $('sr').onchange = () => { const team = $('sr').value === 'Team'; $('scw').classList.toggle('hide', !team); if (!team) $('scl').classList.add('hide'); else $('scl').classList.toggle('hide', $('sc').value !== 'SEL'); };
  $('sc').onchange = () => $('scl').classList.toggle('hide', $('sc').value !== 'SEL');
  $('se').addEventListener('input', () => $('serr').textContent = '');
  $('sadd').onclick = async () => {
    const email = $('se').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('serr').textContent = 'Enter a valid Gmail ID.'; return; }
    const role = $('sr').value; let camps = [];
    if (role === 'Team' && $('sc').value === 'SEL') { camps = [...document.querySelectorAll('.scc:checked')].map(x => x.value); if (!camps.length) { $('serr').textContent = 'Tick at least one camp.'; return; } }
    const b = $('sadd'); b.disabled = true; b.textContent = 'Saving…';
    try { await api('addStaff', TOKEN, email, role, camps); A = await api('getAdminData', TOKEN); drawStaff(); $('sok').textContent = email + ' can now sign in on this page with that Gmail ID.'; }
    catch (e) { b.disabled = false; b.textContent = 'Give access'; handleErr(e, $('serr')); }
  };
  box.querySelectorAll('[data-rs]').forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Remove?'; return; }
    b.disabled = true;
    try { await api('removeStaff', TOKEN, b.dataset.rs); A = await api('getAdminData', TOKEN); drawStaff(); } catch (e) { handleErr(e); b.disabled = false; }
  });
}

/* ================= Start ================= */
if (!API || API.indexOf('http') !== 0) app.innerHTML = '<div class="card">App is not configured: missing server link.</div>';
else CAMP ? donorView() : staffView();

</script>
